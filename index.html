<div class="d-grid mt-3">
    <button class="btn btn-outline-danger btn-sm" id="clearBtn">Clear All Tasks</button>
</div>

<script>
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const clearBtn = document.getElementById('clearBtn'); // New selector

    document.addEventListener('DOMContentLoaded', getTasks);

    function addTask() {
        if (taskInput.value.trim() === "") return;
        createListItem(taskInput.value);
        saveLocalTask(taskInput.value);
        taskInput.value = "";
    }

    function createListItem(text) {
        const li = document.createElement('li');
        li.className = "list-group-item d-flex justify-content-between align-items-center";
        li.innerHTML = `${text} <span class="badge bg-danger rounded-pill">Delete</span>`;
        
        li.addEventListener('click', () => {
            removeLocalTask(text);
            li.remove();
        });
        taskList.appendChild(li);
    }

    // --- NEW: CLEAR ALL LOGIC ---
    function clearAllTasks() {
        if (confirm("Are you sure you want to delete all tasks?")) {
            // 1. Clear the UI
            taskList.innerHTML = "";
            
            // 2. Clear LocalStorage
            localStorage.removeItem('tasks');
        }
    }

    // --- STORAGE HELPERS ---
    function saveLocalTask(task) {
        let tasks = localStorage.getItem('tasks') ? JSON.parse(localStorage.getItem('tasks')) : [];
        tasks.push(task);
        localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function getTasks() {
        let tasks = localStorage.getItem('tasks') ? JSON.parse(localStorage.getItem('tasks')) : [];
        tasks.forEach(task => createListItem(task));
    }

    function removeLocalTask(task) {
        let tasks = JSON.parse(localStorage.getItem('tasks'));
        const filteredTasks = tasks.filter(t => t !== task);
        localStorage.setItem('tasks', JSON.stringify(filteredTasks));
    }

    addBtn.addEventListener('click', addTask);
    clearBtn.addEventListener('click', clearAllTasks); // New listener
    taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });
</script>
